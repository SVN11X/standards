  - name: Manim Community
    url: https://github.com/ManimCommunity/manim
    status: trial
    profiles: [web, docs]
    kind: tool
    license: MIT
    cost: free
    privacy: local, renders on your machine and sends nothing out
    expression: [balanced, expressive]
    notes: Python animation engine. Used in GCP_Data_Engineer_Fieldnotes for three silent 23 to 30 second WebM clips of 0.4 to 0.6 MB each, rendered at 480p15 and shipped with a poster and WebVTT captions. Render time only, so it is not a dependency of the site. Needs ffmpeg and a Python 3.11 virtual environment outside the repository. Use plain text labels, because Tex needs a LaTeX install. Register the open font with manimpango so the labels match the site. Credit the font used in the video.
    evaluated: 2026-11-09
  - name: Mermaid CLI
    url: https://github.com/mermaid-js/mermaid-cli
    status: trial
    profiles: [web, docs]
    kind: tool
    license: MIT
    cost: free
    privacy: local, renders with a browser on your machine and sends nothing out
    expression: [sober, balanced, expressive]
    notes: Renders Mermaid text to SVG. Used in GCP_Data_Engineer_Fieldnotes as a dev dependency with puppeteer_skip_download=true in .npmrc, so npm ci in CI downloads no browser. Render by hand with a local Chrome or Edge through PUPPETEER_EXECUTABLE_PATH and commit the SVG. Set a fixed width and height on the image from the viewBox. Labels in foreignObject use a fallback font inside an img tag, so check them. Pele is the in-browser alternative.
    evaluated: 2026-11-09
  # Candidates from the owner's notes of 2026-11-10. None was opened or run from the session that added them:
  # license, cost and privacy stay "not verified" until someone reads the source. assess means do not install yet.
  - name: FreeLLMAPI
    url: https://github.com/tashfeenahmed/freellmapi
    status: assess
    profiles: [software, data-ai, web]
    kind: tool
    license: not verified
    cost: not verified
    privacy: not verified
    expression: []
    notes: "Optional gateway that routes requests among free providers. First candidate to evaluate as a backend. Listening on localhost does not make it local: the requests go to remote providers, so orchestrate.py counts any gateway as remote. Before trial: prove with a fake server that it can be limited to an allowed list of provider and model before anything is sent, that its internal fallback stays inside that list, which provider answered, and that no charge is possible. Keep fusion and caching of private data off."
    evaluated: 2026-11-10
  - name: Paperclip
    url: https://github.com/paperclipai/paperclip
    status: assess
    profiles: [software, web, data-ai]
    kind: app
    license: not verified
    cost: not verified
    privacy: not verified
    expression: []
    notes: "Optional board to follow several agents and projects: goals, tasks, roles and budgets. It organizes work, it does not decide cost or privacy. Before trial: one stable id across the board task, the run, the worktree and the evidence, one writer per worktree, no delegation loop with the router, and a local deployment without an account. A budget based on reported spend arrives late, so free-strict still needs the gate before each request."
    evaluated: 2026-11-10
