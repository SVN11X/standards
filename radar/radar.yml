# Evaluated tools. Keep one entry per tool, newest evaluation date wins. See README.md for the fields.
entries:
  - name: CSS scroll-driven animations
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/animation-timeline
    status: adopt
    profiles: [web]
    kind: reference
    license: web standard
    cost: free
    privacy: nothing leaves the browser
    expression: [balanced, expressive]
    notes: Supported in all modern browsers. Use only when motion explains something, animate transform and opacity, wrap in @supports with a static fallback, and respect prefers-reduced-motion.
    evaluated: 2026-11-08
  - name: Pele
    url: https://github.com/obsidianmd/pele
    status: trial
    profiles: [web, docs]
    kind: library
    license: MIT
    cost: free
    privacy: renders in the browser
    expression: [sober, balanced, expressive]
    notes: Renders Mermaid syntax to SVG, small and synchronous, themed with CSS variables. Use it in sites that render diagrams. README files keep plain Mermaid, which GitHub renders.
    evaluated: 2026-11-08
  - name: runonweb
    url: https://github.com/midudev/runonweb.ai
    status: trial
    profiles: [web, data-ai]
    kind: library
    license: MIT for the code, each model keeps its own license
    cost: free
    privacy: runs in the browser, but downloads the models to the device
    expression: [sober, balanced, expressive]
    notes: Speech to text, object detection, image embeddings and more with open-weight models. Useful where downloading models is allowed. Credit each model used.
    evaluated: 2026-11-08
  - name: anatomy
    url: https://github.com/wheresryan22/anatomy
    status: trial
    profiles: [web, docs]
    kind: skill
    license: MIT
    cost: free
    privacy: local, no API keys
    expression: [balanced, expressive]
    notes: Interactive isometric figures that explain a concept through a physical metaphor. Label metaphors as illustrative and show the real model next to them.
    evaluated: 2026-11-08
  - name: HyperFrames
    url: https://github.com/heygen-com/hyperframes
    status: trial
    profiles: [web, docs]
    kind: skill
    license: Apache-2.0
    cost: free
    privacy: local rendering
    expression: [balanced, expressive]
    notes: Videos written as HTML, CSS and JavaScript. Check that the export is an H.264 MP4 that plays everywhere.
    evaluated: 2026-11-08
  - name: better-claude
    url: https://github.com/midudev/better-claude
    status: trial
    profiles: [web, software, data-ai, hardware, docs, infra]
    kind: plugin
    license: MIT
    cost: free
    privacy: local
    expression: []
    notes: Install only Sub Meter (usage), Context Meter (when to compact) and Time Machine (a snapshot per turn). Commit overlaps with the autopilot, and Image Preview is untested on Windows.
    evaluated: 2026-11-08
  - name: antislop
    url: https://github.com/miqdadbadjuber/anti-slop
    status: adopt
    profiles: [web, docs, software]
    kind: skill
    license: MIT
    cost: free
    privacy: local
    expression: [sober, balanced, expressive]
    notes: Filters generic interface, copy and code patterns. Install from its own marketplace so it keeps updating.
    evaluated: 2026-11-08
  - name: React Bits
    url: https://reactbits.dev
    status: hold
    profiles: [web]
    kind: library
    license: see its repository
    cost: free
    privacy: local
    expression: [expressive]
    notes: Decorative animated React components. Only for expressive repositories that already use React, with a decision record per component.
    evaluated: 2026-11-08
  - name: DSH SuperAgent
    url: https://github.com/deepseek-ai/dsh-superagent-prototype
    status: assess
    profiles: [software]
    kind: reference
    license: MIT
    cost: needs the DeepSeek platform
    privacy: sends repository content to the provider
    expression: []
    notes: Research prototype of an agent that turns GitHub events into pull requests. Learn from its numbered docs and authorization model. Event-driven agents on public repositories can be steered by anyone who opens an issue.
    evaluated: 2026-11-08
  - name: ThinkRail
    url: https://github.com/JetBrains/thinkrail
    status: assess
    profiles: [software]
    kind: app
    license: see its repository
    cost: free
    privacy: depends on the configured agent
    expression: []
    notes: Agentic IDE with isolated worktrees, living specs and skills. Ideas adopted by the standard. No need to switch tools.
    evaluated: 2026-11-08
  - name: SeshDock
    url: https://github.com/Avoiptv/seshdock
    status: assess
    profiles: [software]
    kind: app
    license: MIT
    cost: free
    privacy: local and read-only
    expression: []
    notes: Finds Claude Code and Codex sessions on the machine. The Windows installer is not signed yet.
    evaluated: 2026-11-08
  - name: Google Developer Knowledge MCP
    url: https://developers.google.com/knowledge/mcp
    status: trial
    profiles: [data-ai, software, docs, infra]
    kind: tool
    license: Google hosted service, terms of service apply
    cost: no price stated in the docs, needs a Google Cloud project, quotas apply
    privacy: queries and the API key are sent to Google, no repository content
    expression: []
    notes: Official remote MCP server in public preview that searches and reads public Google developer docs (Cloud, Firebase, Android, Maps). Use it only to verify facts against current docs, never as a runtime dependency. Keep the API key out of repositories, restrict it to this API and give each repository its own project quota. Re-check pricing and preview status before relying on it.
    evaluated: 2026-11-08
  - name: OpenCode
    url: https://github.com/anomalyco/opencode
    status: trial
    profiles: [web, software, data-ai, hardware, docs, infra]
    kind: tool
    license: MIT
    cost: free, its free models have rate limits, other providers bill separately
    privacy: free models keep prompts and code, other providers receive repository content, only a local model through Ollama keeps everything on the machine
    expression: []
    notes: Second coding agent for small, verified work on a free model, so Claude usage goes to planning and reviews. Reads AGENTS.md and the skills in ~/.agents/skills. Set it up with scripts/setup-opencode.ps1. Never run /init, it rewrites the generated AGENTS.md. Never sign in with a Claude subscription, Anthropic allows it only in Claude Code and claude.ai. Use free models only in personal repositories, never with work or client code. Hooks and Claude Code subagents do not run there, so repo-improve and deep reviews stay in Claude Code.
    evaluated: 2026-11-08
  - name: Ollama
    url: https://github.com/ollama/ollama
    status: trial
    profiles: [software, data-ai, hardware]
    kind: tool
    license: MIT
    cost: free
    privacy: local, models are downloaded once
    expression: [sober, balanced, expressive]
    notes: Called directly through its API by scripts/orchestrate.py for short local work. On a 6 GB card qwen3.5:4b ran fully on the GPU and qwen3.5:9b split with the CPU and was several times slower, one machine, November 2026. Never use embedding models for chat.
    evaluated: 2026-11-09
  - name: Context7 MCP
    url: https://github.com/upstash/context7
    status: trial
    profiles: [web, software, data-ai]
    kind: tool
    license: MIT
    cost: free tier with limits
    privacy: library names and questions go to Upstash
    expression: [sober, balanced, expressive]
    notes: Current documentation by library version. Off by default, turned on per task from settings/mcp/catalog.yml at a pinned version.
    evaluated: 2026-11-09
  - name: Playwright MCP
    url: https://github.com/microsoft/playwright-mcp
    status: trial
    profiles: [web]
    kind: tool
    license: Apache-2.0
    cost: free
    privacy: only the pages it opens
    expression: [sober, balanced, expressive]
    notes: Explores and reproduces UI bugs in a real browser. The evidence that stays is a Playwright Test case, not the exploration.
    evaluated: 2026-11-09
  - name: Serena MCP
    url: https://github.com/oraios/serena
    status: assess
    profiles: [software, data-ai]
    kind: tool
    license: GPL-3.0-or-later for the agent, MIT for its language server layer
    cost: free
    privacy: local
    expression: [sober, balanced, expressive]
    notes: Symbol search through language servers. Overlaps with the agents' own search. Move to trial only after a bench shows fewer reads on a large repository.
    evaluated: 2026-11-09
  - name: GitHub MCP Server
    url: https://github.com/github/github-mcp-server
    status: assess
    profiles: [web, software, data-ai, hardware, docs, infra]
    kind: tool
    license: MIT
    cost: free
    privacy: requests to the GitHub API with a personal token
    expression: [sober, balanced, expressive]
    notes: Overlaps with the gh CLI the owner already uses. If ever used, read-only mode with a token limited to the needed repositories.
    evaluated: 2026-11-09
  - name: MCP Inspector
    url: https://github.com/modelcontextprotocol/inspector
    status: trial
    profiles: [web, software, data-ai, hardware, docs, infra]
    kind: tool
    license: Apache-2.0 for new code, MIT for older parts
    cost: free
    privacy: local, stores server secrets in the OS keychain
    expression: [sober, balanced, expressive]
    notes: Lists the tools of an MCP server before it is turned on. Used by orchestrate.py mcp inspect.
    evaluated: 2026-11-09
  - name: Promptfoo
    url: https://github.com/promptfoo/promptfoo
    status: assess
    profiles: [data-ai, software]
    kind: tool
    license: MIT
    cost: free, the models it calls may not be
    privacy: sends prompts to the providers under test
    expression: [sober, balanced, expressive]
    notes: Prompt and model evaluation and red teaming. The deterministic suite in scripts/adversarial.py covers the controls without it. Consider it for repositories that ship prompts.
    evaluated: 2026-11-09
  - name: actionlint
    url: https://github.com/rhysd/actionlint
    status: adopt
    profiles: [web, software, data-ai, hardware, docs, infra]
    kind: tool
    license: MIT
    cost: free
    privacy: local
    expression: [sober, balanced, expressive]
    notes: Validates GitHub Actions workflows. Runs in the selftest workflow at a pinned version with a checksum.
    evaluated: 2026-11-09
  - name: zizmor
    url: https://github.com/zizmorcore/zizmor
    status: adopt
    profiles: [web, software, data-ai, hardware, docs, infra]
    kind: tool
    license: MIT
    cost: free
    privacy: local with --offline
    expression: [sober, balanced, expressive]
    notes: Security audit of workflows. Found 16 real problems in this repository (unpinned actions, tokens kept by checkout), all fixed in 1.12.0.
    evaluated: 2026-11-09
  - name: Ruff
    url: https://github.com/astral-sh/ruff
    status: adopt
    profiles: [software, data-ai, hardware, infra]
    kind: tool
    license: MIT
    cost: free
    privacy: local
    expression: [sober, balanced, expressive]
    notes: Python linter and formatter. verify.py gates on syntax errors, undefined names and unused imports only, so older code is not flooded with style findings.
    evaluated: 2026-11-09
  - name: uv
    url: https://github.com/astral-sh/uv
    status: trial
    profiles: [software, data-ai, hardware, infra]
    kind: tool
    license: MIT or Apache-2.0
    cost: free
    privacy: downloads packages from PyPI
    expression: [sober, balanced, expressive]
    notes: Fast Python environments and tool runs (uvx). Optional, the standard's scripts need only Python and PyYAML.
    evaluated: 2026-11-09
  - name: pytest
    url: https://github.com/pytest-dev/pytest
    status: adopt
    profiles: [software, data-ai, hardware, infra]
    kind: tool
    license: MIT
    cost: free
    privacy: local
    expression: [sober, balanced, expressive]
    notes: Default test runner for Python repositories. The standard's own tests use unittest so they need nothing installed.
    evaluated: 2026-11-09
  - name: Playwright Test
    url: https://github.com/microsoft/playwright
    status: adopt
    profiles: [web]
    kind: tool
    license: Apache-2.0
    cost: free
    privacy: local
    expression: [sober, balanced, expressive]
    notes: Reproducible browser tests and visual snapshots for websites. See web-improve references/regression-testing.md.
    evaluated: 2026-11-09
  - name: ast-grep
    url: https://github.com/ast-grep/ast-grep
    status: trial
    profiles: [software, web, data-ai]
    kind: tool
    license: MIT
    cost: free
    privacy: local
    expression: [sober, balanced, expressive]
    notes: Structural search and rewrite by syntax tree. Use it instead of a model for mechanical code changes across many files.
    evaluated: 2026-11-09
  - name: Renovate
    url: https://github.com/renovatebot/renovate
    status: hold
    profiles: [web, software, data-ai, hardware, docs, infra]
    kind: tool
    license: AGPL-3.0-only
    cost: free
    privacy: reads the repository through its app or runner
    expression: [sober, balanced, expressive]
    notes: Dependabot is built into GitHub and covers the need without another app. Revisit only if grouping rules become necessary.
    evaluated: 2026-11-09
  - name: SQLite FTS5
    url: https://www.sqlite.org/fts5.html
    status: adopt
    profiles: [software, data-ai]
    kind: library
    license: public domain
    cost: free
    privacy: local
    expression: [sober, balanced, expressive]
    notes: Full-text index behind scripts/memory.py. Included in the official Python builds for Windows. verify.py --live checks it.
    evaluated: 2026-11-09
  - name: sqlite-vec
    url: https://github.com/asg017/sqlite-vec
    status: assess
    profiles: [data-ai]
    kind: library
    license: MIT or Apache-2.0
    cost: free
    privacy: local
    expression: [sober, balanced, expressive]
    notes: Vector search inside SQLite. Add it only when a measurement shows FTS5 misses what the agents need.
    evaluated: 2026-11-09
  - name: just
    url: https://github.com/casey/just
    status: hold
    profiles: [software, infra]
    kind: tool
    license: CC0-1.0
    cost: free
    privacy: local
    expression: [sober, balanced, expressive]
    notes: A command runner. The standard's scripts and README sections already name every command, so it adds a tool without a gain.
    evaluated: 2026-11-09
