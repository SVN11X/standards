# Reusable check that every repository calls from .github/workflows/standard.yml.
name: check

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the pinned version from .standard.yml
        id: version
        run: |
          line="$(grep -E '^standard:' .standard.yml | head -n 1 | sed -E 's/^standard:[[:space:]]*//; s/[[:space:]]*(#.*)?$//')"
          ref="${line#*@}"
          if ! [[ "$ref" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error file=.standard.yml::standard must look like SVN11X/standards@v1"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # The repository is fixed so a pull request cannot point the check at other code.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          repository: SVN11X/standards
          ref: ${{ steps.version.outputs.ref }}
          path: .standards

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Structure, intent and slop
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          REPO_DESCRIPTION: ${{ github.event.repository.description }}
          REPO_HOMEPAGE: ${{ github.event.repository.homepage }}
          REPO_TOPICS: ${{ join(github.event.repository.topics, ',') }}
        run: python .standards/scripts/standard.py check .

      - name: Pull request contract
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python .standards/scripts/standard.py check . --pr

      - name: Secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: --no-progress --exclude-loopback --accept 200,206,403,429 --max-concurrency 8 --max-retries 5 --retry-wait-time 10 --timeout 30 --exclude-path .standards './**/*.md'
          fail: true
