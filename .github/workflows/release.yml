# Reusable release: every repository calls it from .github/workflows/release.yml when a v* tag is pushed.
# The release notes come from the matching section of CHANGELOG.md.
name: release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the pinned version from .standard.yml
        id: version
        run: |
          line="$(grep -E '^standard:' .standard.yml | head -n 1 | sed -E 's/^standard:[[:space:]]*//; s/[[:space:]]*(#.*)?$//')"
          ref="${line#*@}"
          if ! [[ "$ref" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error file=.standard.yml::standard must look like SVN11X/standards@v1"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: SVN11X/standards
          ref: ${{ steps.version.outputs.ref }}
          path: .standards

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Release notes from CHANGELOG.md
        run: python .standards/scripts/standard.py notes . "${GITHUB_REF_NAME#v}" --output "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
