# Model candidates: one entry per provider, model and endpoint. Read by scripts/orchestrate.py and scripts/analyze.py.
# An entry enables nothing. A local model counts when it is installed. A remote model counts when the owner
# checked it as free (orchestrate.py consent --free-model) and the cost and privacy rules of
# settings/orchestration.yml allow it. Measurements never live here: they go to ~/.standards/bench.jsonl.
#
# cost: local, free-quota, free-promo, subscription, trial, paid or unknown.
# data: what the provider does with what it receives. stores and trains are "yes", "no" or "unknown".
# evidence: declared (read on the provider's page on the `checked` date) or candidate (named by a guide or a
#   list, not read on an official page). Nothing here was measured.
# capabilities: only what a source states (code, tools, vision, embedding). Any model that is not an
#   embedding model is assumed to chat. What Ollama reports for an installed model wins over this list.
# review_by: optional date after which a free offer no longer counts until someone checks it again.
# A field nobody confirmed stays null. Do not fill one in from memory.
version: 1
noted: 2026-11-10
# Where the entries come from. They were not opened from the session that wrote this file.
noted_from: the owner's notes of 2026-11-10

models:
