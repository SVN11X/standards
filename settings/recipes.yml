         writes: false, cost: free, leaves_machine: only the pages it opens, detect: {signal: playwright}}
      - {id: playwright-mcp, kind: mcp, runs: local, radar: Playwright MCP, mcp: playwright, transport: stdio,
         clients: [claude, opencode], writes: false, cost: free, leaves_machine: only the pages it opens, detect: {mcp: playwright}}
