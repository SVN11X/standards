# The first recipe whose intent matches and that has the most signals and words wins. `signals_any` are
# fingerprint signals of the folder the request is about. `words` name the subject of the request, in English
# and Spanish. They also pick the folder when a repository holds several projects. `verbs` only tell two
# recipes with the same signals apart, such as a fix from a redesign. `proof` is what shows the task is done.
# It is evidence to collect, never a claim.
recipes:
  - id: repo-onboarding
    intents: [setup]
    profile: null
    capabilities: [repo-setup, unit-test]
    proof: the profile, the restrictions and one command that verifies the repository are recorded
  - id: pr-review
    intents: [review]
    # Naming the object of the review wins over what the folder shows: a PR in a web repository is still a PR review.
    wins_on: [pr, prs, pull request, pull requests, merge request, diff, parche, patch, commit, commits]
    profile: null
    capabilities: [code-review, github, unit-test]
    proof: every finding names a line of the diff and the tests of the repository ran
  - id: web-experience
    intents: [work]
    signals_any: [web, static-web, react, vue, svelte, astro, next, pwa]
    words: [design, diseño, visual, attention, atención, layout, style, estilo, look, hero, landing, page, página, portada, ui,
            interface, interfaz, animation, animación, typography, tipografía, mobile, móvil, responsive, understand, entienda]
    profile: web
    experience: true
    capabilities: [visual-design, browser-test, accessibility, unit-test]
    proof: the main activity can be completed on a phone and on a desktop, with the keyboard, and its explanation is understood
  - id: web-fix
    intents: [work]
    signals_any: [web, static-web, react, vue, svelte, astro, next, pwa]
    verbs: [bug, fix, corrige, corregir, arregla, arreglar, error, falla, fails, broken, roto, crash, regression, regresión]
    profile: web
    capabilities: [code-navigation, browser-test, unit-test]
    proof: the failure is reproduced first, then a test that fails without the change passes with it
  - id: windows-app
    intents: [work]
    signals_any: [windows, desktop, tauri, dotnet]
    words: [window, ventana, windows, desktop, escritorio, exe, ejecutable, native, nativa, nativo, focus, foco, tray, win32, bandeja,
            aviso, avisos, notificación, notificaciones, notification, dialog, diálogo, popup, emergente, teclado, keyboard]
    profile: software
    capabilities: [code-navigation, unit-test, native-ui-test, desktop-ux, usability-test]
    proof: the failure is reproduced and fixed in the window of the executable, on Windows
    notes: a browser test does not prove that a native window works
  - id: data-pipeline
    intents: [work]
    signals_any: [scraper, http-client, notebook, dataframe, sqlite]
    words: [extract, extracción, extractor, scraper, resume, reanuda, reanudar, checkpoint, cursor, dataset, transcription,
            transcripción, duplica, duplicate, ids, pipeline, import, importa]
    profile: data-ai
    capabilities: [code-navigation, unit-test, data-integrity]
    proof: after an interruption the cursor, the ids and the assets are the same as in an uninterrupted run
    notes: reuse the cached results and the stored collection. Never extract everything again to test one change
  - id: docs-academic
    intents: [work, review]
    signals_any: [latex, bibliography]
    words: [thesis, tesis, chapter, capítulo, bibliography, bibliografía, pdf, latex, cite, cita]
    profile: docs
    capabilities: [docs-review, calculation-check]
    proof: the document builds, every reference resolves and the arithmetic check lists no wrong calculation
  - id: learning-site
    intents: [work, review]
    signals_any: [learning-content, web, static-web]
    words: [aprender, aprendizaje, aprende, estudiar, estudio, estudiante, estudiantes, examen, exámenes, quiz, pregunta, preguntas, lección, lecciones, curso,
      repaso, repasar, memorizar, recordar, practicar, práctica, flashcards, tarjetas, learn, learning, learner, learners, study, student, exam, question,
      questions, lesson, lessons, course, flashcard, practice, retention, remember, certificación, certification]
    profile: web
    experience: true
    capabilities: [learning-design, question-quality, writing-check, comprehension-test, ux-review, browser-test, accessibility, unit-test]
    proof: the question audit shows no integrity error, every question explains why, practice mixes topics and comes back over days, and five learners finish
      a lesson and answer its questions from memory
    notes: learning is shown by what learners recall later, not by how the page looks
  - id: learning-app
    intents: [work, review]
    words: [aprender, aprendizaje, aprende, estudiar, estudio, estudiante, estudiantes, examen, exámenes, quiz, pregunta, preguntas, lección,
      lecciones, curso, repaso, repasar, memorizar, recordar, practicar, práctica, flashcards, tarjetas, cuestionario, cuestionarios, learn,
      learning, learner, learners, study, student, exam, question, questions, lesson, lessons, course, flashcard, practice, retention,
      remember, certificación, certification]
    capabilities: [learning-design, question-quality, writing-check, comprehension-test, desktop-ux, usability-test, unit-test]
    proof: every question explains why, practice mixes topics and comes back over days, and five learners finish a session and answer its
      questions from memory
    notes: a learning app outside a web page, such as a desktop tutor. Questions kept in code are reviewed by reading them, because the
      question audit reads data files
  - id: content-clarity
    intents: [work, review]
    words: [texto, textos, redacción, redacta, reescribe, claridad, claro, clara, legible, entender, entienda, entiende, comprender, comprensión, explicación,
      explica, copy, wording, readme, documentación, mensaje, mensajes, instrucciones, tono, text, writing, clear, clarity, readable, understand, docs, documentation,
      instructions, message, messages, microcopy, ux]
    capabilities: [writing-check, comprehension-test, ux-review]
    proof: the text check shows no finding the owner did not accept, and five readers of the audience finish the task the page is for
    notes: a readability score is a proxy. Only readers who finish the task show that the text helps
  - id: visual-asset
    intents: [work]
    words: [diagrama, diagramas, diagram, diagrams, imagen, imágenes, image, images, ilustración, illustration, foto, fotos, photo, icono, iconos, icon, icons,
      video, vídeo, videos, animación, animation, clip, clips, gráfico, gráficos, chart, charts, figura, figure, captura, screenshot, infografía, infographic,
      gif, miniatura, thumbnail, esquema, visual, visuales]
    capabilities: [diagram, image-search, image-create, image-attach, short-video, media-check, accessibility]
    proof: every image has alt text, a size and a credit its license allows, the media audit shows nothing new, and every clip plays as H.264 or WebM with
      captions and a poster
    notes: keep the source of every diagram and clip next to the file it renders
  - id: powershell-script
    intents: [work]
    signals_any: [powershell]
    words: [powershell, ps1, script, instalación, install, setup]
    profile: software
    capabilities: [code-navigation, powershell-check, unit-test]
    proof: PSScriptAnalyzer reports nothing new and a Pester test covers the changed branch, run in Windows PowerShell 5.1
  - id: api-service
    intents: [work]
    signals_any: [openapi, pact, msw, cloudflare-worker]
    words: [api, endpoint, contrato, contract, openapi, swagger, worker, servicio, service]
    profile: software
    capabilities: [code-navigation, api-contract, unit-test]
    proof: the API description validates and a contract or mock test covers the change
  - id: infra
    intents: [work]
    signals_any: [terraform, kubernetes, docker, cloudflare-worker]
    words: [infra, infraestructura, infrastructure, terraform, despliegue, deploy, cluster, kubernetes, docker, contenedor, container]
    profile: infra
    capabilities: [infrastructure, supply-chain, unit-test]
    proof: the plan or the test of the module passes and changes no resource outside the request
  - id: hardware
    intents: [work]
    signals_any: [kicad, firmware]
    profile: hardware
    capabilities: [hardware-check, diagram, docs-build]
    proof: the board passes its rule checks and the firmware tests pass in the emulator or on the board
  - id: mobile-app
    intents: [work]
    signals_any: [android, ios, react-native, expo, godot, unity]
    profile: software
    capabilities: [code-navigation, mobile-test, unit-test]
    proof: the build installs on an emulator or a device and the changed flow passes its test there
  - id: ci-maintenance
    intents: [work, review]
    signals_any: [ci]
    words: [workflow, workflows, actions, ci, pipeline, dependabot, renovate, dependencias, dependencies, release, versión]
    capabilities: [ci-maintenance, supply-chain]
    proof: actionlint and zizmor report nothing new and the workflow runs green on a pull request
  - id: general-code
    intents: [work]
    signals_any: [node, python, go, rust, typescript, dotnet, powershell]
    profile: software
    capabilities: [code-navigation, unit-test]
    proof: a test that fails without the change passes with it

# A capability added to any recipe when the request shows the need.
additions:
  - capability: library-docs
    words: [version, versión, upgrade, actualiza, migrate, migra, migration, migración, deprecated, obsoleto, api, breaking]
    why: the answer depends on the version of a library
  - capability: diagram
    words: [diagrama, diagramas, diagram, diagrams, esquema, flujo, flowchart, arquitectura, architecture]
    why: the request asks for a diagram
  - capability: image-search
    words: [foto, fotos, photo, photos, busca una imagen, buscar imágenes, stock, find an image, imagen libre]
    why: the request asks for an existing image
  - capability: image-attach
    words: [imagen, imágenes, image, images, foto, fotos, photo, ilustración, illustration, icono, icon]
    why: an image needs alt text, a size and a credit
  - capability: animated-film
    words: [película, pelicula, cortometraje, corto animado, dibujos animados, storyboard, guion gráfico, escenas, animated film, cartoon, short film]
    why: the request asks for an animated film made by scenes
  - capability: narrated-video
    words: [narrado, narrada, narración, narrar, voz en off, locución, voice-over, voiceover, narrated, narration, explainer,
      video explicativo, vídeo explicativo, demo del producto, product demo, screencast, grabación de pantalla]
    why: the request asks for a video with a voice
  - capability: calculation-check
    words: [cálculo, cálculos, cuentas, presupuesto, aritmética, calculation, calculations, arithmetic, budget, sumas, totales]
    why: the document states calculations that can be re-computed
  - capability: project-plan
    words: [plan de negocio, plan de proyecto, plan de empresa, business plan, project plan, estudio de viabilidad, feasibility study]
    why: the request asks for the plan of a real project, not of a code change
  - capability: short-video
    words: [video, vídeo, videos, clip, clips, animación, animation, gif]
    why: the request asks for a clip
  - capability: writing-check
    words: [texto, textos, redacción, claridad, claro, entender, entienda, explicación, text, wording, clear, readable]
    why: the request is about how the text reads
  - capability: learning-design
    words: [aprender, aprendizaje, estudiar, repaso, memorizar, learn, learning, study, retention]
    why: the request is about learning
  - capability: performance
    words: [lento, lenta, rendimiento, carga, velocidad, slow, performance, speed, load time, pesa]
    why: the request is about speed
  - capability: supply-chain
    words: [dependencia, dependencias, dependency, dependencies, vulnerabilidad, vulnerability, secreto, secret, licencia, license]
    why: the request touches dependencies, secrets or licenses
  - capability: observability
    words: [producción, production, incidente, incident, sentry, grafana, logs, traza, trace, métricas, metrics]
    why: the request is about a running application
  - capability: work-tracking
    words: [issue, jira, linear, notion, confluence, ticket, azure devops]
    why: the task comes from a tracker
  - capability: database-access
    words: [base de datos, database, supabase, consulta sql, sql query, dbt, hugging face, dataset]
    why: the request needs data a database or a hub holds
  - capability: data-validation
    words: [esquema de datos, schema, columnas, columns, nulos, nulls, tabla, tables, lote, batch, notebook]
    why: the request is about the shape of data
  - capability: docs-build
    words: [pdf, word, docx, latex, compilar, build the document, pandoc, quarto, bibliografía, bibliography]
    why: the request asks for a built document
