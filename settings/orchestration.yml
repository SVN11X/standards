# Policy for scripts/orchestrate.py. These are limits and preferences, not measurements.
# Measured results live in the owner's bench history (~/.standards/bench.jsonl) and reorder the candidates.
version: 1

# What may leave the machine for each privacy class. The class of a folder comes from the owner's
# ~/.standards/local.yml. A repository can make its own class stricter with `privacy:` in .standard.yml,
# never looser. allow: yes. owner: only when local.yml says so for that folder. deny: never.
# remote_data lists what a free remote model may do with what it receives: none (keeps nothing and does not
# train), stores (keeps it for a time, does not train) or trains (may use it to improve a model). A model
# whose data use nobody recorded is never used. The data use comes from settings/models.yml or from the owner's check.
privacy:
  default: personal-private
  order: [personal-public, personal-private, work, restricted]
  classes:
    personal-public: {local: allow, remote_free: allow, remote_claude: allow, remote_data: [none, stores, trains]}
    personal-private: {local: allow, remote_free: owner, remote_claude: allow, remote_data: [none]}
    work: {local: allow, remote_free: deny, remote_claude: owner, remote_data: []}
    restricted: {local: allow, remote_free: deny, remote_claude: deny, remote_data: []}

# What a run may cost. The owner's mode is cost_mode in ~/.standards/local.yml (orchestrate.py consent --cost-mode).
# A run can ask for a stricter mode with --mode or STANDARDS_COST_MODE, never a looser one. Strictest first.
#   local-only: programs and models on this machine. Nothing is sent to a provider.
#   free-strict: the above plus free remote models the owner checked. No subscription and no paid fallback.
#   existing-subscription: the above plus Claude Code, which the owner already pays for.
cost:
  default: existing-subscription
  order: [local-only, free-strict, existing-subscription]
  modes:
    local-only: {local: allow, remote_free: deny, remote_claude: deny}
    free-strict: {local: allow, remote_free: allow, remote_claude: deny}
    existing-subscription: {local: allow, remote_free: allow, remote_claude: allow}
  # Cost categories of settings/models.yml that count as free. trial, paid and unknown never do.
  free_categories: [local, free-quota, free-promo]

# Risk decides who reviews, not which brand works. Yellow and red need the owner before integration, and a model
# other than the planner needs measured passes in the bench class of the task.
risk:
  green: {review: checks}
  yellow: {review: owner, needs: proven}
  red: {review: owner, needs: proven}

# Candidates per task type, in order. tools means a program without AI (git, grep, a parser, a linter, tests).
# api means a model of a remote provider in settings/providers.yml. It is used only after it passed the bench class of the task.
tasks:
  search: [tools]
  format: [tools]
  lint: [tools]
  test: [tools]
  hash: [tools]
  schema: [tools]
  classify: [ollama, api]
  summarize-short: [ollama, api]
  extract-short: [ollama, api]
  edit-small: [opencode]
  fix-test: [opencode]
  docs-small: [opencode, ollama]
  edit-large: [opencode]
  refactor: [opencode]
  # Web work. Direction is a design decision. A pattern, a test or a check error is bounded code. Copy is short text.
  web-pattern: [opencode]
  web-test: [opencode]
  web-copy: [ollama, opencode, api]
  web-classify: [ollama, api]
  web-visual-review: [ollama, api]
  fix-check: [opencode]

# Task types that are architecture decisions. route() answers executor "planner": the owner asks
# Claude directly and nothing runs on its own. They never appear in the candidate lists above.
planner_tasks: [plan, web-direction]

# A task type that is not listed above and is not planner work is blocked until it is classified.
# No list may contain claude: Claude Code is the planner and a bench-only executor.
unknown_task: []

# Task types where a model other than the planner must first pass the bench class that measures the task.
proven_only: [edit-large, refactor, web-visual-review]

# What a model must be able to do for a task type, checked against what Ollama reports or settings/models.yml declares.
needs:
  web-visual-review: [vision]

limits:
  edit_small_max_files: 5
  ollama_max_input_chars: 8000
  opencode_timeout_s: 600
  ollama_timeout_s: 120
  test_timeout_s: 600
  free_recheck_days: 30
  bench_min_runs: 3
  bench_min_pass_rate: 0.8
  bench_recheck_days: 30
  # A provider's price list older than this no longer proves that a model is free.
  provider_list_max_age_h: 24
  output_tail_chars: 4000

executors:
  ollama:
    url: http://127.0.0.1:11434
    # Chat models in order of preference. A model only counts when it is installed.
    prefer: [qwen3.5:4b, qwen2.5:7b, qwen3.5:9b]
    # A model split between GPU and CPU was several times slower on a 6 GB card. Below this share it is used
    # only when its own bench history passes for the task.
    min_gpu_share: 0.9
    # Embedding models answer no chat. They serve local search only.
    never_chat: [qwen3-embedding:0.6b]
    think: false
    num_ctx: 4096
    num_predict: 400
    # How long Ollama keeps the model loaded after a call. Unset keeps Ollama's own default.
    # keep_alive: 10m
  opencode:
    # {model} and {message} are filled in. The message points to a task file in the worktree.
    command: [opencode, run, --model, "{model}", "{message}"]
    # Matched against `opencode models`. Only models the owner checked as free in local.yml are used.
    # A model that keeps or trains on what it receives sorts after one that does not, whatever its name.
    prefer_match: [glm, deepseek, mimo]
  claude:
    # Used by bench only. Claude Code itself is the planner and does not delegate to itself.
    command: [claude, -p, --permission-mode, acceptEdits, "{message}"]

# The night run of scripts/analyze.py. It tests what is installed and allowed, one local model at a time.
analysis:
  runs: 3
  night_budget_s: 28800
  chat_run_timeout_s: 300
  # Sessions per remote model in one night when settings/models.yml names no daily limit.
  remote_runs_per_model: 9
  # An agent session makes several requests. This estimate is charged against a model's requests_per_day.
  requests_per_agent_run: 10
  # Share of a provider's daily requests one night may use, and the sessions it gets when no limit is known.
  api_budget_share: 0.8
  api_requests_when_unknown: 60
  # A local model is tested only when its size with this overhead fits in the graphics memory plus this share of the RAM.
  memory_overhead: 1.15
  ram_share: 0.6

# Files that running code or tests creates on its own. They never count as a change by the executor.
generated: ["__pycache__/*", "*/__pycache__/*", "*.pyc", ".pytest_cache/*", ".ruff_cache/*", ".mypy_cache/*", "node_modules/*"]

# Files a delegated executor must never change. Each run can add more with --protect.
protected: [AGENTS.md, CLAUDE.md, .standard.yml, docs/goals.md, .github/workflows/*]
